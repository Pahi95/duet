name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the version all reported results were produced with. 3.11 is
        # the floor, set by anndata >= 0.12 rather than by anything in DUET --
        # a 3.10 job cannot resolve its dependencies at all.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Import check (no optional extras installed)
        run: python -c "import duet; print(duet.__version__)"

      - name: Run tests
        run: pytest tests/ -q
